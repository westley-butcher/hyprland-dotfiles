general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(26, 26, 26, 1.0)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(26, 26, 26, 1.0)
    outer_color = rgba(00CCCCff)
    font_color = rgb(230, 230, 230)
    check_color = rgba(00CCCCff)
    fail_color = rgba(cc3333ff)
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(230, 230, 230)
    font_size = 90
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(150, 150, 150)
    font_size = 22
    position = 0, 10
    halign = center
    valign = center
}
